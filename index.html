<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devidtur | Links</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: rgba(22, 24, 33, 0.75);
            --card-hover: rgba(30, 33, 45, 0.9);
            --accent-kick: #53fc18;
            --accent-offline: #727a8e;
            --accent-youtube: #ff0000;
            --accent-discord: #5865f2;
            --text-color: #ffffff;
            --text-secondary: #8d93a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            background: radial-gradient(circle at top, #141722 0%, #08090c 100%);
        }

        /* Mouse Glow Cursor Effect */
        #cursorGlow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(83, 252, 24, 0.12) 0%, rgba(88, 101, 242, 0.05) 50%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: transform 0.05s ease-out;
        }

        /* Animated Stars Canvas Background */
        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Watermark Text Background with Gentle Pulsing Animation */
        .bg-watermark {
            position: absolute;
            top: 260px;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(4rem, 15vw, 11rem);
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            letter-spacing: 12px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            text-transform: uppercase;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.05);
            animation: watermarkPulse 8s ease-in-out infinite alternate;
        }

        @keyframes watermarkPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.98);
                opacity: 0.7;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.04);
                opacity: 1;
            }
        }

        /* Intro Screen Overlay */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #08090c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #introScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-avatar-wrapper {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-kick), var(--accent-discord));
            box-shadow: 0 0 50px rgba(83, 252, 24, 0.4);
            animation: introPulse 2s infinite alternate;
        }

        .intro-avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .intro-text {
            margin-top: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-color);
            text-transform: uppercase;
            opacity: 0.8;
            animation: blinkText 1.5s infinite;
        }

        @keyframes introPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 30px rgba(83, 252, 24, 0.3); }
            100% { transform: scale(1.05); box-shadow: 0 0 60px rgba(83, 252, 24, 0.6); }
        }

        @keyframes blinkText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Profile Section */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-kick), #1f2230);
            box-shadow: 0 0 30px rgba(83, 252, 24, 0.2);
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--card-bg);
            display: block;
        }

        .username {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 4px;
            transition: all 0.3s ease;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-offline);
            transition: all 0.3s ease;
        }

        .status-badge.online {
            border-color: rgba(83, 252, 24, 0.3);
            color: #ffffff;
            background: rgba(83, 252, 24, 0.08);
        }

        .status-badge.online .dot {
            background-color: var(--accent-kick);
            box-shadow: 0 0 8px var(--accent-kick);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Links Section */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            font-size: 1.05rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .link-card .external-icon {
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background-color: var(--card-hover);
        }

        .link-card:hover .external-icon {
            color: var(--text-color);
            transform: translate(2px, -2px);
        }

        /* Kick */
        .link-card.kick:hover {
            border-color: rgba(83, 252, 24, 0.4);
            box-shadow: 0 8px 25px rgba(83, 252, 24, 0.15);
        }
        .link-card.kick .icon-box {
            color: var(--accent-kick);
            background: rgba(83, 252, 24, 0.1);
        }

        /* YouTube */
        .link-card.youtube:hover {
            border-color: rgba(255, 0, 0, 0.4);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.15);
        }
        .link-card.youtube .icon-box {
            color: var(--accent-youtube);
            background: rgba(255, 0, 0, 0.1);
        }

        /* Discord */
        .link-card.discord:hover {
            border-color: rgba(88, 101, 242, 0.4);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.15);
        }
        .link-card.discord .icon-box {
            color: var(--accent-discord);
            background: rgba(88, 101, 242, 0.1);
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="introScreen" onclick="dismissIntro()">
        <div class="intro-avatar-wrapper">
            <img src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="DEVIDTUR Profile">
        </div>
        <div class="intro-text">CLICK TO ENTER</div>
    </div>

    <!-- Background Elements -->
    <div id="cursorGlow"></div>
    <canvas id="starsCanvas"></canvas>
    <div class="bg-watermark">DEVIDTUR</div>

    <div class="container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="#" class="nav-item">LINKS</a>
        </div>

        <!-- Profile -->
        <div class="profile">
            <div class="avatar-wrapper" id="avatarWrapper">
                <img src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="devidtur profile">
            </div>
            <h1 class="username">DEVIDTUR</h1>
            <div class="sub-title">OFFICIAL LINKS</div>
            <p class="bio">Official Links & Community 🎮</p>
            
            <div class="status-badge" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">CHECKING...</span>
            </div>
        </div>

        <!-- Links List -->
        <div class="links-list">
            
            <!-- Kick -->
            <a href="https://kick.com/devidtur" target="_blank" class="link-card kick">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span>Kick</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@devidtur" target="_blank" class="link-card youtube">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <span>YouTube</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>

            <!-- Discord -->
            <a href="https://discord.gg/dFRSaAVqeQ" target="_blank" class="link-card discord">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-discord"></i>
                    </div>
                    <span>Discord</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
            </a>

        </div>

        <footer>
            © DEVIDTUR | ALL RIGHTS RESERVED
        </footer>
    </div>

    <!-- Interactive Scripts -->
    <script>
        // 1. Intro Screen Dismiss
        function dismissIntro() {
            const intro = document.getElementById('introScreen');
            intro.classList.add('hidden');
        }

        // Auto dismiss intro after 1.5s if not clicked
        setTimeout(() => {
            dismissIntro();
        }, 1500);

        // 2. Mouse Glow Movement
        const cursorGlow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // 3. Animated Stars Background
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 8000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005,
                    dy: Math.random() * 0.3 + 0.1
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();

                // Twinkle & Motion
                star.alpha += star.speed;
                if (star.alpha >= 1 || star.alpha <= 0.1) {
                    star.speed = -star.speed;
                }
                star.y -= star.dy;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();

        // 4. Kick Live Status Check
        async function checkKickLiveStatus() {
            const channelName = 'devidtur';
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const avatarWrapper = document.getElementById('avatarWrapper');

            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + channelName)}`);
                if (response.ok) {
                    const data = await response.json();
                    const channelData = JSON.parse(data.contents);

                    if (channelData && channelData.livestream !== null) {
                        statusBadge.classList.add('online');
                        statusText.innerText = 'ONLINE';
                        avatarWrapper.style.boxShadow = '0 0 35px rgba(83, 252, 24, 0.5)';
                    } else {
                        statusBadge.classList.remove('online');
                        statusText.innerText = 'OFFLINE';
                        avatarWrapper.style.boxShadow = 'none';
                    }
                } else {
                    statusText.innerText = 'OFFLINE';
                }
            } catch (error) {
                statusText.innerText = 'OFFLINE';
            }
        }

        checkKickLiveStatus();
        setInterval(checkKickLiveStatus, 60000);
    </script>
</body>
</html>
