<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devidtur | Links</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #03060d;
            --card-bg: rgba(10, 18, 36, 0.75);
            --card-hover: rgba(18, 30, 58, 0.9);
            --accent-kick: #53fc18;
            --accent-youtube: #ff0000;
            --accent-discord: #5865f2;
            --accent-blue-glow: #00d2ff;
            --accent-offline: #50617a;
            --text-color: #ffffff;
            --text-secondary: #8298ba;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            background: radial-gradient(circle at top, #09152a 0%, #03060d 100%);
        }

        /* Mouse Glow Cursor Effect */
        #cursorGlow {
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 136, 255, 0.15) 0%, rgba(0, 210, 255, 0.05) 50%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            will-change: left, top;
            transition: left 0.1s cubic-bezier(0.25, 1, 0.5, 1), top 0.1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Animated Stars Canvas Background */
        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Watermark Text Background */
        .bg-watermark {
            position: absolute;
            top: 260px;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(4rem, 15vw, 11rem);
            font-weight: 900;
            color: rgba(0, 136, 255, 0.03);
            letter-spacing: 12px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            text-transform: uppercase;
            -webkit-text-stroke: 1px rgba(0, 136, 255, 0.07);
            animation: watermarkPulse 8s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        @keyframes watermarkPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.98);
                opacity: 0.6;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.04);
                opacity: 1;
            }
        }

        /* Intro Screen Overlay - Smooth Sensei-FR Fade Style */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 6, 13, 0.96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transform: translateZ(0);
            will-change: opacity, visibility;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #introScreen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-avatar-wrapper {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-blue-glow), #0088ff);
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.35);
            animation: introPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;
            transition: transform 0.5s ease;
        }

        #introScreen:hover .intro-avatar-wrapper {
            transform: scale(1.03);
        }

        .intro-avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .intro-text {
            margin-top: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-color);
            text-transform: uppercase;
            animation: blinkText 2s ease-in-out infinite;
        }

        @keyframes introPulse {
            0% { transform: scale(0.97); box-shadow: 0 0 20px rgba(0, 136, 255, 0.25); }
            100% { transform: scale(1.03); box-shadow: 0 0 50px rgba(0, 210, 255, 0.5); }
        }

        @keyframes blinkText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            gap: 8px;
            background: rgba(0, 136, 255, 0.04);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(0, 136, 255, 0.15);
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 1px;
            background: rgba(0, 136, 255, 0.12);
            border: 1px solid rgba(0, 136, 255, 0.25);
        }

        /* Profile Section */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-blue-glow), #0b1d3a);
            box-shadow: 0 0 30px rgba(0, 136, 255, 0.3);
            margin-bottom: 5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--card-bg);
            display: block;
        }

        .username {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 136, 255, 0.05);
            color: var(--text-secondary);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 136, 255, 0.15);
            margin-top: 4px;
            transition: all 0.3s ease;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-offline);
            transition: all 0.3s ease;
        }

        .status-badge.online {
            border-color: rgba(83, 252, 24, 0.4);
            color: #ffffff;
            background: rgba(83, 252, 24, 0.12);
        }

        .status-badge.online .dot {
            background-color: var(--accent-kick);
            box-shadow: 0 0 10px var(--accent-kick);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Links Section */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(12, 20, 36, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.3rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-card i {
            font-size: 1.4rem;
        }

        /* YouTube Card Style */
        .link-card.youtube {
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff3b3b;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
        }
        .link-card.youtube:hover {
            border-color: rgba(255, 0, 0, 0.9);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
            transform: translateY(-3px);
            background-color: rgba(25, 15, 25, 0.9);
        }

        /* Kick Card Style */
        .link-card.kick {
            border: 1px solid rgba(83, 252, 24, 0.5);
            color: #53fc18;
            box-shadow: 0 0 20px rgba(83, 252, 24, 0.15);
        }
        .link-card.kick:hover {
            border-color: rgba(83, 252, 24, 0.9);
            box-shadow: 0 0 30px rgba(83, 252, 24, 0.35);
            transform: translateY(-3px);
            background-color: rgba(12, 30, 20, 0.9);
        }

        /* Discord Card Style */
        .link-card.discord {
            border: 1px solid rgba(88, 101, 242, 0.5);
            color: #7289da;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.15);
        }
        .link-card.discord:hover {
            border-color: rgba(88, 101, 242, 0.9);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.35);
            transform: translateY(-3px);
            background-color: rgba(15, 20, 40, 0.9);
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="introScreen">
        <div class="intro-avatar-wrapper">
            <img src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="DEVIDTUR Profile">
        </div>
        <div class="intro-text">CLICK TO ENTER</div>
    </div>

    <!-- Background Elements -->
    <div id="cursorGlow"></div>
    <canvas id="starsCanvas"></canvas>
    <div class="bg-watermark">DEVIDTUR</div>

    <div class="container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <a href="#" class="nav-item">LINKS</a>
        </div>

        <!-- Profile -->
        <div class="profile">
            <div class="avatar-wrapper" id="avatarWrapper">
                <img src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="devidtur profile">
            </div>
            <h1 class="username">DEVIDTUR</h1>
            <div class="sub-title">OFFICIAL LINKS</div>
            <p class="bio">Official Links & Community 🎮</p>
            
            <div class="status-badge" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">OFFLINE</span>
            </div>
        </div>

        <!-- Links List -->
        <div class="links-list">
            
            <!-- Kick -->
            <a href="https://kick.com/devidtur" target="_blank" class="link-card kick">
                <div class="link-content">
                    <span>Kick</span>
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@devidtur" target="_blank" class="link-card youtube">
                <div class="link-content">
                    <span>YouTube</span>
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </a>

            <!-- Discord -->
            <a href="https://discord.gg/dFRSaAVqeQ" target="_blank" class="link-card discord">
                <div class="link-content">
                    <span>Discord</span>
                    <i class="fa-brands fa-discord"></i>
                </div>
            </a>

        </div>

        <footer>
            © DEVIDTUR | ALL RIGHTS RESERVED
        </footer>
    </div>

    <!-- Interactive Scripts -->
    <script>
        // 1. Fail-Safe Intro Screen Dismissal
        const introScreen = document.getElementById('introScreen');
        let isClosed = false;

        function handleCloseIntro() {
            if (isClosed) return;
            isClosed = true;
            introScreen.classList.add('fade-out');
            setTimeout(() => {
                introScreen.style.display = 'none';
            }, 850);
        }

        // Event listeners for Click, Touch (Mobile) & Keydown
        introScreen.addEventListener('click', handleCloseIntro, { passive: true });
        introScreen.addEventListener('touchstart', handleCloseIntro, { passive: true });
        window.addEventListener('keydown', handleCloseIntro, { passive: true });

        // Auto-dismiss safety timer after 1 second so it never gets stuck
        setTimeout(handleCloseIntro, 1000);

        // 2. Mouse Glow Effect
        const cursorGlow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        }, { passive: true });

        // 3. Blue Animated Stars Background
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 8000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.015 + 0.005,
                    dy: Math.random() * 0.2 + 0.05,
                    color: Math.random() > 0.4 ? 'rgba(0, 210, 255, ' : 'rgba(255, 255, 255, '
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color + star.alpha + ')';
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha >= 0.9 || star.alpha <= 0.1) {
                    star.speed = -star.speed;
                }
                star.y -= star.dy;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();

        // 4. Kick Live Status Checker
        async function checkKickLiveStatus() {
            const channelName = 'devidtur';
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const avatarWrapper = document.getElementById('avatarWrapper');

            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent('https://kick.com/api/v2/channels/' + channelName)}`;
                const response = await fetch(proxyUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.livestream !== null && data.livestream !== undefined) {
                        statusBadge.classList.add('online');
                        statusText.innerText = 'ONLINE';
                        avatarWrapper.style.boxShadow = '0 0 35px rgba(83, 252, 24, 0.6)';
                        return;
                    }
                }
            } catch (e) {}

            statusBadge.classList.remove('online');
            statusText.innerText = 'OFFLINE';
            avatarWrapper.style.boxShadow = '0 0 30px rgba(0, 136, 255, 0.3)';
        }

        checkKickLiveStatus();
        setInterval(checkKickLiveStatus, 45000);
    </script>
</body>
</html>
