<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devidtur | All Clips</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #020408;
            --accent-kick: #53fc18;
            --accent-blue: #00d2ff;
            --accent-purple: #7928ca;
            --text-color: #ffffff;
            --text-secondary: #8298ba;
            --card-bg: rgba(10, 18, 32, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(121, 40, 202, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 0%, #0a1329 0%, #020408 100%);
        }

        /* BACKGROUND CYBER WAVES */
        .bg-lines-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        .cyber-line {
            position: absolute;
            width: 160%;
            height: 2px;
            left: -30%;
            background: linear-gradient(90deg, transparent, rgba(0, 210, 255, 0.8), rgba(121, 40, 202, 0.6), transparent);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transform: rotate(-12deg);
        }

        .line-1 { top: 8%; }
        .line-2 { top: 16%; opacity: 0.5; }
        .line-3 { top: 25%; opacity: 0.3; }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1;
        }

        .section-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding: 0 5px;
        }

        .refresh-status {
            font-size: 0.8rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .clip-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .clip-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-4px);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
        }

        .clip-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #000;
        }

        .clip-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .clip-title {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clip-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="bg-lines-container">
        <div class="cyber-line line-1"></div>
        <div class="cyber-line line-2"></div>
        <div class="cyber-line line-3"></div>
    </div>

    <div class="container">
        <div class="section-header">
            <span id="clipCount">טוען קליפים...</span>
            <div class="refresh-status">
                <i class="fa-solid fa-rotate fa-spin" id="clipRefreshIcon"></i>
                <span>מתעדכן כל 10 דקות</span>
            </div>
        </div>

        <div id="clipsContainer" class="clips-grid">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner fa-spin"></i> טוען את כל הקליפים מ-Kick...
            </div>
        </div>
    </div>

    <script>
        const channelSlug = 'devidtur';

        async function fetchAllClips() {
            const container = document.getElementById('clipsContainer');
            const clipCountText = document.getElementById('clipCount');
            const refreshIcon = document.getElementById('clipRefreshIcon');
            
            refreshIcon.classList.add('fa-spin');
            
            let allClips = [];
            let nextCursor = null;
            let hasMore = true;
            let safetyLimit = 10; // מונע בלולאה אינסופית במידת הצורך

            try {
                while (hasMore && safetyLimit > 0) {
                    safetyLimit--;
                    
                    // פנייה ל-API של Kick כולל range=all ומיון לפי תאריך (sort=date)
                    let apiUrl = `https://kick.com/api/v2/channels/${channelSlug}/clips?sort=date&range=all`;
                    if (nextCursor) {
                        apiUrl += `&cursor=${nextCursor}`;
                    }

                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`;
                    const response = await fetch(proxyUrl);
                    
                    if (!response.ok) break;

                    const data = await response.json();
                    
                    const clips = data.clips || data;
                    if (Array.isArray(clips) && clips.length > 0) {
                        allClips = allClips.concat(clips);
                        
                        // בדיקה אם יש עמוד נוסף של קליפים
                        if (data.nextCursor || (data.pagination && data.pagination.cursor)) {
                            nextCursor = data.nextCursor || data.pagination.cursor;
                        } else {
                            hasMore = false;
                        }
                    } else {
                        hasMore = false;
                    }

                    // אם אין מנגנון עמודים מוחזר, עצור לאחר הסיבוב הראשון
                    if (!data.nextCursor && (!data.pagination || !data.pagination.cursor)) {
                        hasMore = false;
                    }
                }

                if (allClips.length > 0) {
                    clipCountText.innerText = `סה"כ ${allClips.length} קליפים מכל הזמנים`;
                    container.innerHTML = '';

                    allClips.forEach(clip => {
                        const card = document.createElement('a');
                        card.className = 'clip-card';
                        card.href = `https://kick.com/${channelSlug}?clip=${clip.id}`;
                        card.target = '_blank';

                        const duration = clip.duration ? `${clip.duration} שניות` : '';
                        const views = clip.views ? `${clip.views} צפיות` : '';

                        card.innerHTML = `
                            <img class="clip-thumb" src="${clip.thumbnail_url || 'https://via.placeholder.com/320x180'}" alt="${clip.title || 'Clip'}">
                            <div class="clip-info">
                                <div class="clip-title">${clip.title || 'קליפ ללא כותרת'}</div>
                                <div class="clip-meta">
                                    <span><i class="fa-solid fa-eye"></i> ${views}</span>
                                    <span>${duration}</span>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    clipCountText.innerText = 'קליפים מ-Kick';
                    container.innerHTML = `<div class="loading-spinner">לא נמצאו קליפים בערוץ.</div>`;
                }

            } catch (err) {
                clipCountText.innerText = 'קליפים מ-Kick';
                container.innerHTML = `
                    <div class="loading-spinner">
                        לא ניתן למשוך קליפים ישירות כרגע.<br>
                        <a href="https://kick.com/${channelSlug}/clips?sort=date&range=all" target="_blank" style="color: var(--accent-kick); text-decoration: underline; margin-top: 10px; display: inline-block;">
                            לחץ כאן לצפייה בקליפים ב-Kick
                        </a>
                    </div>`;
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // טעינה ראשונית
        fetchAllClips();

        // עדכון אוטומטי כל 10 דקות (600,000 מילי-שניות)
        setInterval(fetchAllClips, 10 * 60 * 1000);
    </script>
</body>
</html>
