<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVIDTUR | Emotes & Links</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #020408;
            --accent-kick: #53fc18;
            --accent-youtube: #ff0000;
            --accent-discord: #5865f2;
            --accent-tiktok: #fe2c55;
            --accent-blue: #00d2ff;
            --accent-purple: #7928ca;
            --text-color: #ffffff;
            --text-secondary: #8298ba;
            --card-bg: rgba(10, 18, 32, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(121, 40, 202, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 0%, #0a1329 0%, #020408 100%);
        }

        /* BACKGROUND CYBER WAVES */
        .bg-lines-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.6;
        }

        .cyber-line {
            position: absolute;
            width: 160%;
            height: 2px;
            left: -30%;
            background: linear-gradient(90deg, transparent, rgba(0, 210, 255, 0.8), rgba(121, 40, 202, 0.6), transparent);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transform: rotate(-12deg);
        }

        .line-1 { top: 8%; animation: waveMove 10s ease-in-out infinite alternate; }
        .line-2 { top: 16%; opacity: 0.5; animation: waveMove 14s ease-in-out infinite alternate-reverse; }
        .line-3 { top: 25%; opacity: 0.3; animation: waveMove 18s ease-in-out infinite alternate; }

        @keyframes waveMove {
            0% { transform: rotate(-14deg) translateY(-10px); }
            100% { transform: rotate(-10deg) translateY(10px); }
        }

        /* CURSOR GLOW */
        #cursorGlow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, rgba(121, 40, 202, 0.06) 50%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            will-change: left, top;
        }

        /* STARS CANVAS */
        #starsCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* AUTOMATIC DISINTEGRATION INTRO OVERLAY */
        #introScreen {
            position: fixed;
            inset: 0;
            background: #020408;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .intro-logo-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-blue);
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.6);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, filter 0.6s ease;
        }

        .intro-avatar.disintegrate {
            transform: scale(1.35);
            opacity: 0;
            filter: blur(12px) contrast(180%);
        }

        #disintegrateCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* WATERMARK BACKGROUND */
        .bg-watermark {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(3.5rem, 13vw, 10rem);
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: 10px;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            text-transform: uppercase;
            -webkit-text-stroke: 1px rgba(0, 210, 255, 0.08);
            animation: watermarkPulse 8s ease-in-out infinite alternate;
        }

        @keyframes watermarkPulse {
            0% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.04); opacity: 1; }
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1;
            animation: containerReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes containerReveal {
            0% { opacity: 0; transform: translateY(20px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* TOP NAV BAR */
        .top-nav {
            display: flex;
            gap: 8px;
            background: rgba(10, 18, 36, 0.6);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid rgba(0, 210, 255, 0.18);
            margin-bottom: 10px;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.25s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--text-color);
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(121, 40, 202, 0.25));
            border: 1px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        /* PROFILE HEADER */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .username {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* TAB SECTIONS */
        .tab-content {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.4s ease forwards;
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* LINKS & CLIPS BUTTON */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(12, 20, 36, 0.9), rgba(5, 10, 20, 0.9));
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.3rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .link-card.kick { border: 1px solid rgba(83, 252, 24, 0.5); color: #53fc18; box-shadow: 0 0 20px rgba(83, 252, 24, 0.12); }
        .link-card.kick:hover { border-color: rgba(83, 252, 24, 0.9); box-shadow: 0 0 30px rgba(83, 252, 24, 0.35); transform: translateY(-3px); }

        .link-card.youtube { border: 1px solid rgba(255, 0, 0, 0.5); color: #ff3b3b; box-shadow: 0 0 20px rgba(255, 0, 0, 0.12); }
        .link-card.youtube:hover { border-color: rgba(255, 0, 0, 0.9); box-shadow: 0 0 30px rgba(255, 0, 0, 0.35); transform: translateY(-3px); }

        .link-card.tiktok { border: 1px solid rgba(254, 44, 85, 0.5); color: #fe2c55; box-shadow: 0 0 20px rgba(254, 44, 85, 0.12); }
        .link-card.tiktok:hover { border-color: rgba(254, 44, 85, 0.9); box-shadow: 0 0 30px rgba(254, 44, 85, 0.35); transform: translateY(-3px); }

        .link-card.discord { border: 1px solid rgba(88, 101, 242, 0.5); color: #7289da; box-shadow: 0 0 20px rgba(88, 101, 242, 0.12); }
        .link-card.discord:hover { border-color: rgba(88, 101, 242, 0.9); box-shadow: 0 0 30px rgba(88, 101, 242, 0.35); transform: translateY(-3px); }

        .link-content { display: flex; align-items: center; gap: 12px; }

        /* EMOTES */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0 5px;
        }

        .emotes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(121, 40, 202, 0.3);
        }

        @media (min-width: 480px) {
            .emotes-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .emote-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease;
        }

        .emote-item:hover {
            transform: scale(1.08);
            border-color: var(--accent-purple);
            background: rgba(121, 40, 202, 0.2);
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.3);
        }

        .emote-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .emote-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="introScreen">
        <canvas id="disintegrateCanvas"></canvas>
        <div class="intro-logo-container">
            <img id="introAvatar" class="intro-avatar" src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="DEVIDTUR Profile">
        </div>
    </div>

    <!-- Background Elements -->
    <div class="bg-lines-container">
        <div class="cyber-line line-1"></div>
        <div class="cyber-line line-2"></div>
        <div class="cyber-line line-3"></div>
    </div>
    <div id="cursorGlow"></div>
    <canvas id="starsCanvas"></canvas>
    <div class="bg-watermark">DEVIDTUR</div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- התפריט העליון -->
        <div class="top-nav">
            <button class="nav-btn" onclick="switchTab('clipsTab', this)">CLIPS</button>

            <div class="avatar-wrapper">

        </div>

        <!-- TAB 1: CLIPS -->
        <div id="clipsTab" class="tab-content">
            <a href="https://kick.com/devidtur/clips?sort=date&range=all" target="_blank" class="link-card kick">

        </div>

        <!-- TAB 2: LINKS -->
        <div id="linksTab" class="tab-content active">

            <a href="https://discord.gg/dFRSaAVqeQ" target="_blank" class="link-card discord">

        <!-- TAB 3: EMOTES (מעודכן עם הקישורים הישירים) -->
        <div id="emotesTab" class="tab-content">
            <div class="section-header">
                <span>אימוטים ובאדג'ים של סאבים</span>
            </div>
            <div class="emotes-grid">
                <div class="emote-item">

                <div class="emote-item">

                <div class="emote-item">

                <div class="emote-item">
                    <img src="https://i.ibb.co/rKLFf9Fw/2cd43413218e2eb5.png" alt="Bear AK">

        <footer>© DEVIDTUR | ALL RIGHTS RESERVED</footer>

    <!-- Scripts -->
    <script>
        function runDisintegrationIntro() {
            const canvas = document.getElementById('disintegrateCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const particles = [];
            const colors = ['#00d2ff', '#7928ca', '#53fc18', '#ffffff', '#00e5ff'];
            const particleCount = 220;

            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 3;
                const dist = Math.random() * 55;
                particles.push({
                    x: centerX + Math.cos(angle) * dist,
                    y: centerY + Math.sin(angle) * dist,
                    vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 4,
                    vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 4 - 1.5,
                    size: Math.random() * 4.5 + 1.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.022 + 0.012,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.25
                });
            }

            let animating = false;

            setTimeout(function() {
                const avatar = document.getElementById('introAvatar');
                if (avatar) avatar.classList.add('disintegrate');
                animating = true;

                setTimeout(function() {
                    const introScreen = document.getElementById('introScreen');
                    if (introScreen) {
                        introScreen.style.opacity = '0';
                        setTimeout(function() { introScreen.style.display = 'none'; }, 800);
                    }
                }, 350);
            }, 500);

            function renderParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (animating) {
                    particles.forEach(function(p) {
                        if (p.alpha > 0) {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.vx *= 0.96;
                            p.vy *= 0.96;
                            p.alpha -= p.decay;
                            p.rotation += p.vRot;

                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.rotation);
                            ctx.globalAlpha = Math.max(0, p.alpha);
                            ctx.fillStyle = p.color;
                            ctx.shadowColor = p.color;
                            ctx.shadowBlur = 10;
                            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
                            ctx.restore();
                        }
                    });
                }
                requestAnimationFrame(renderParticles);
            }

            renderParticles();
        }

        window.addEventListener('load', runDisintegrationIntro);

        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }, { passive: true });

        function animateCursor() {
            currentX += (mouseX - currentX) * 0.15;
            currentY += (mouseY - currentY) * 0.15;
            if (cursorGlow) {
                cursorGlow.style.left = currentX + 'px';
                cursorGlow.style.top = currentY + 'px';
            }
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 10000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.012 + 0.005,
                    dy: Math.random() * 0.2 + 0.05,
                    color: Math.random() > 0.4 ? 'rgba(0, 210, 255, ' : 'rgba(255, 255, 255, '
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(function(star) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color + star.alpha + ')';
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha >= 0.9 || star.alpha <= 0.1) {
                    star.speed = -star.speed;
                }
                star.y -= star.dy;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(function(tab) { tab.classList.remove('active'); });
            document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
