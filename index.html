<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devidtur | Links</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #020408;
            --accent-kick: #53fc18;
            --accent-youtube: #ff0000;
            --accent-discord: #5865f2;
            --accent-blue: #00d2ff;
            --accent-purple: #7928ca;
            --accent-offline: #50617a;
            --text-color: #ffffff;
            --text-secondary: #8298ba;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(121, 40, 202, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 0%, #0a1329 0%, #020408 100%);
        }

        /* BACKGROUND CYBER WAVES / LINES (AS REQUESTED) */
        .bg-lines-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.6;
        }

        .cyber-line {
            position: absolute;
            width: 160%;
            height: 2px;
            left: -30%;
            background: linear-gradient(90deg, transparent, rgba(0, 210, 255, 0.8), rgba(121, 40, 202, 0.6), transparent);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transform: rotate(-12deg);
        }

        .line-1 { top: 8%; animation: waveMove 10s ease-in-out infinite alternate; }
        .line-2 { top: 16%; opacity: 0.5; animation: waveMove 14s ease-in-out infinite alternate-reverse; }
        .line-3 { top: 25%; opacity: 0.3; animation: waveMove 18s ease-in-out infinite alternate; }

        @keyframes waveMove {
            0% { transform: rotate(-14deg) translateY(-10px); }
            100% { transform: rotate(-10deg) translateY(10px); }
        }

        /* INTRO SCREEN */
        #introScreen {
            position: fixed;
            inset: 0;
            background: #020408;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            cursor: pointer;
            user-select: none;
            transform: translateZ(0);
            will-change: opacity, transform;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        .intro-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translateZ(0);
            will-change: transform, opacity;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
        }

        .intro-avatar-wrapper {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.4);
            animation: introPulse 2s ease-in-out infinite alternate;
        }

        .intro-avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .intro-text {
            margin-top: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-color);
            text-transform: uppercase;
            animation: blinkText 1.8s ease-in-out infinite;
        }

        @keyframes introPulse {
            0% { transform: scale(0.97); box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
            100% { transform: scale(1.03); box-shadow: 0 0 50px rgba(121, 40, 202, 0.6); }
        }

        @keyframes blinkText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #introScreen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #introScreen.fade-out .intro-content {
            transform: scale(1.2);
            opacity: 0;
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1;
            
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            will-change: transform, opacity;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.site-active .container {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* CURSOR GLOW */
        #cursorGlow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, rgba(121, 40, 202, 0.06) 50%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            will-change: left, top;
        }

        /* STARS CANVAS */
        #starsCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* WATERMARK BACKGROUND */
        .bg-watermark {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(4rem, 15vw, 11rem);
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: 12px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            text-transform: uppercase;
            -webkit-text-stroke: 1px rgba(0, 210, 255, 0.08);
            animation: watermarkPulse 8s ease-in-out infinite alternate;
        }

        @keyframes watermarkPulse {
            0% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.04); opacity: 1; }
        }

        /* TOP NAV BAR */
        .top-nav {
            display: flex;
            gap: 8px;
            background: rgba(10, 18, 36, 0.6);
            padding: 6px 10px;
            border-radius: 30px;
            border: 1px solid rgba(0, 210, 255, 0.18);
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-item {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.25s ease;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--text-color);
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(121, 40, 202, 0.25));
            border: 1px solid rgba(0, 210, 255, 0.4);
        }

        /* PROFILE */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            margin-bottom: 5px;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .username {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* STATUS BADGE */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.05);
            color: var(--text-secondary);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 210, 255, 0.15);
            margin-top: 4px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-offline);
        }

        .status-badge.online {
            border-color: rgba(83, 252, 24, 0.4);
            color: #ffffff;
            background: rgba(83, 252, 24, 0.12);
        }

        .status-badge.online .dot {
            background-color: var(--accent-kick);
            box-shadow: 0 0 10px var(--accent-kick);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* LINKS SECTION */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(12, 20, 36, 0.9), rgba(5, 10, 20, 0.9));
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.3rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* CARD STYLES */
        .link-card.kick {
            border: 1px solid rgba(83, 252, 24, 0.5);
            color: #53fc18;
            box-shadow: 0 0 20px rgba(83, 252, 24, 0.12);
        }
        .link-card.kick:hover {
            border-color: rgba(83, 252, 24, 0.9);
            box-shadow: 0 0 30px rgba(83, 252, 24, 0.35);
            transform: translateY(-3px);
        }

        .link-card.youtube {
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff3b3b;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.12);
        }
        .link-card.youtube:hover {
            border-color: rgba(255, 0, 0, 0.9);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
            transform: translateY(-3px);
        }

        .link-card.discord {
            border: 1px solid rgba(88, 101, 242, 0.5);
            color: #7289da;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.12);
        }
        .link-card.discord:hover {
            border-color: rgba(88, 101, 242, 0.9);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.35);
            transform: translateY(-3px);
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="introScreen">
        <div class="intro-content">
            <div class="intro-avatar-wrapper">
                <img src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="DEVIDTUR Profile">
            </div>
            <div class="intro-text">CLICK TO ENTER</div>
        </div>
    </div>

    <!-- Background Elements -->
    <div class="bg-lines-container">
        <div class="cyber-line line-1"></div>
        <div class="cyber-line line-2"></div>
        <div class="cyber-line line-3"></div>
    </div>
    <div id="cursorGlow"></div>
    <canvas id="starsCanvas"></canvas>
    <div class="bg-watermark">DEVIDTUR</div>

    <!-- Main Content Container -->
    <div class="container">
        <div class="top-nav">
            <a href="#" class="nav-item active">LINKS</a>
            <a href="#" class="nav-item">SETUP</a>
            <a href="#" class="nav-item">SCHEDULE</a>
            <a href="#" class="nav-item">EMOTES</a>
            <a href="#" class="nav-item">CLIPS</a>
        </div>

        <div class="profile">
            <div class="avatar-wrapper" id="avatarWrapper">
                <img src="https://files.kick.com/images/user/3901323/profile_image/conversion/88de265e-9f7a-4ffa-884c-bfa702331367-fullsize.webp" alt="devidtur profile">
            </div>
            <h1 class="username">DEVIDTUR</h1>
            <div class="sub-title">OFFICIAL LINKS</div>
            <p class="bio">Official Links & Community 🎮</p>
            
            <div class="status-badge" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">OFFLINE</span>
            </div>
        </div>

        <div class="links-list">
            <a href="https://kick.com/devidtur" target="_blank" class="link-card kick">
                <div class="link-content">
                    <span>Kick</span>
                    <i class="fa-solid fa-play"></i>
                </div>
            </a>

            <a href="https://www.youtube.com/@devidtur" target="_blank" class="link-card youtube">
                <div class="link-content">
                    <span>YouTube</span>
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </a>

            <a href="https://discord.gg/dFRSaAVqeQ" target="_blank" class="link-card discord">
                <div class="link-content">
                    <span>Discord</span>
                    <i class="fa-brands fa-discord"></i>
                </div>
            </a>
        </div>

        <footer>
            © DEVIDTUR | ALL RIGHTS RESERVED
        </footer>
    </div>

    <!-- Interactive Scripts -->
    <script>
        const introScreen = document.getElementById('introScreen');
        let isOpened = false;

        function handleEnter() {
            if (isOpened) return;
            isOpened = true;

            document.body.classList.add('site-active');
            introScreen.classList.add('fade-out');

            setTimeout(() => {
                introScreen.style.display = 'none';
            }, 500);
        }

        introScreen.addEventListener('click', handleEnter);
        introScreen.addEventListener('touchstart', handleEnter, { passive: true });

        // Smooth Mouse Cursor Glow
        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }, { passive: true });

        function animateCursor() {
            currentX += (mouseX - currentX) * 0.15;
            currentY += (mouseY - currentY) * 0.15;
            cursorGlow.style.left = currentX + 'px';
            cursorGlow.style.top = currentY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Canvas Stars
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 10000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.012 + 0.005,
                    dy: Math.random() * 0.2 + 0.05,
                    color: Math.random() > 0.4 ? 'rgba(0, 210, 255, ' : 'rgba(255, 255, 255, '
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color + star.alpha + ')';
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha >= 0.9 || star.alpha <= 0.1) {
                    star.speed = -star.speed;
                }
                star.y -= star.dy;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();

        // Kick Live Status Check
        async function checkKickLiveStatus() {
            const channelName = 'devidtur';
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const avatarWrapper = document.getElementById('avatarWrapper');

            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent('https://kick.com/api/v2/channels/' + channelName)}`;
                const response = await fetch(proxyUrl);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.livestream !== null && data.livestream !== undefined) {
                        statusBadge.classList.add('online');
                        statusText.innerText = 'ONLINE';
                        avatarWrapper.style.boxShadow = '0 0 35px rgba(83, 252, 24, 0.6)';
                        return;
                    }
                }
            } catch (e) {}

            statusBadge.classList.remove('online');
            statusText.innerText = 'OFFLINE';
            avatarWrapper.style.boxShadow = '0 0 30px rgba(0, 210, 255, 0.3)';
        }

        checkKickLiveStatus();
        setInterval(checkKickLiveStatus, 45000);
    </script>
</body>
</html>
